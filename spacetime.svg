<circle r="3" fill="#22d3ee"/></g><text x="160" y="160" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="18" font-weight="700" fill="#e6edf3">能力の制約</text><text x="160" y="182" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Hiragino Sans','Noto Sans JP',monospace" font-size="11" fill="#22d3ee" letter-spacing="3">CAPABILITY</text><text x="160" y="212" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12.5" fill="#8b949e">睡眠・食事など、</text><text x="160" y="232" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="12.5" fill="#8b949e">生物学的に必須な活動</text><rect x="340.5" y=".5" width="319" height="249" rx="14" fill="#0d1117" stroke="#1c2533"/><text x="364" y="32" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Hiragino Sans','Noto Sans JP',monospace" font-size="11" fill="#3b4a5e">02</text><rect x="592" y="18" width="44" height="18" rx="9" fill="none" stroke="#a78bfa"/><text x="614" y="31" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Hiragino Sans','Noto Sans JP',monospace" font-size="10" fill="#a78bfa" letter-spacing="1">KEY</text><g transform="translate(500,92)"><line x1="-37" x2="37" stroke="#a78bfa" stroke-dasharray="4 4" opacity=".8"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1s" repeatCount="indefinite"/></line>
