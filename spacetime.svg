<g stroke="#22d3ee" opacity=".6"><line y1="-30" y2="-24"/><line y1="30" y2="24"/><line x1="-30" x2="-24"/><line x1="30" x2="24"/></g>
<line y2="-22" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></line>
