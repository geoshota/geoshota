<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Shota Kodama - Environmental Geography, Tohoku University" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="gv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#141b26" stroke-width="1"/></pattern>
  <radialGradient id="glow" cx="0.78" cy="0.6" r="0.45"><stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".16"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="card"><rect width="1200" height="380" rx="18"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="380" fill="#0a0d13"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>
  <rect width="1200" height="60" y="-60" fill="url(#scan)"><animate attributeName="y" from="-60" to="380" dur="7s" repeatCount="indefinite"/></rect>

  <!-- left: identity -->
  <g font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">
    <text x="60" y="84" font-size="12" fill="#22d3ee" letter-spacing="3">// ENVIRONMENTAL GEOGRAPHY · GIS</text>
  </g>
  <text x="58" y="156" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="700" fill="url(#g)" letter-spacing="-1.5">Shota Kodama</text>
  <text x="62" y="196" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="22" fill="#8b949e" letter-spacing="8">児玉 尚汰</text>

  <g font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="15">
    <rect x="60" y="233" width="8" height="17" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    <text x="82" y="248" fill="#c9d1d9" opacity="0">GIS / Behavioral Geography / Disaster Studies<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
    <text x="82" y="248" fill="#c9d1d9" opacity="0">Spatiotemporal analysis of technical intern trainees<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="3s" repeatCount="indefinite"/></text>
    <text x="82" y="248" fill="#c9d1d9" opacity="0">Mixed methods approach to spatial vulnerability<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="6s" repeatCount="indefinite"/></text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#9fb0c3">
    <rect x="60" y="292" width="150" height="30" rx="15" fill="#0f1620" stroke="#243041"/><text x="135" y="311" text-anchor="middle">Tohoku University</text>
    <rect x="222" y="292" width="122" height="30" rx="15" fill="#0f1620" stroke="#243041"/><text x="283" y="311" text-anchor="middle">Nakaya GeoLab</text>
    <rect x="356" y="292" width="100" height="30" rx="15" fill="#0f1620" stroke="#243041"/><text x="406" y="311" text-anchor="middle">Sendai, JP</text>
  </g>

  <!-- right: space-time cube (Hagerstrand) -->
  <g font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="10" fill="#5b6b7f">
    <text x="1140" y="42" text-anchor="end" fill="#3b4a5e" letter-spacing="2">SPACE–TIME CUBE</text>
    <polygon points="940,190 1078.6,270 940,350 801.4,270" fill="#22d3ee" fill-opacity=".05" stroke="#2b3a4d"/>
    <g stroke="#1e2a3a" stroke-width="1">
      <line x1="905.4" y1="210" x2="1044" y2="290"/><line x1="870.7" y1="230" x2="1009.3" y2="310"/><line x1="836" y1="250" x2="974.6" y2="330"/>
      <line x1="974.6" y1="210" x2="836.1" y2="290"/><line x1="1009.3" y1="230" x2="870.7" y2="310"/><line x1="1043.9" y1="250" x2="905.4" y2="330"/>
    </g>
    <line x1="940" y1="190" x2="940" y2="10" stroke="#3b4a5e"/>
    <path d="M936 18 L940 8 L944 18" fill="none" stroke="#3b4a5e"/>
    <g stroke="#3b4a5e"><line x1="936" y1="145" x2="944" y2="145"/><line x1="936" y1="100" x2="944" y2="100"/><line x1="936" y1="55" x2="944" y2="55"/></g>
    <text x="950" y="148">06:00</text><text x="950" y="103">12:00</text><text x="950" y="58">18:00</text>
    <text x="952" y="20" fill="#8b949e">t</text>
    <text x="1088" y="278">x</text><text x="788" y="278">y</text>

    <!-- activity spaces -->
    <ellipse cx="862" cy="265" rx="46" ry="26" fill="none" stroke="#22d3ee" stroke-dasharray="3 4" opacity=".55"><animate attributeName="opacity" values=".25;.7;.25" dur="3s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="1009" cy="270" rx="46" ry="26" fill="none" stroke="#a78bfa" stroke-dasharray="3 4" opacity=".55"><animate attributeName="opacity" values=".7;.25;.7" dur="3s" repeatCount="indefinite"/></ellipse>
    <circle cx="862" cy="265" r="4" fill="#22d3ee"/><circle cx="862" cy="265" r="4" fill="none" stroke="#22d3ee"><animate attributeName="r" values="4;20" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1009" cy="270" r="4" fill="#a78bfa"/><circle cx="1009" cy="270" r="4" fill="none" stroke="#a78bfa"><animate attributeName="r" values="4;20" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <text x="820" y="300" fill="#22d3ee">HOME</text><text x="1022" y="304" fill="#a78bfa">WORK</text>
    <line x1="1009" y1="270" x2="1009" y2="160" stroke="#a78bfa" stroke-dasharray="2 4" opacity=".6"/>

    <!-- space-time path -->
    <path d="M862 265 L862 225 L1009 210 L1009 160 L862 135 L862 90" fill="none" stroke="url(#gv)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" filter="url(#blur)" opacity=".55"><animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;0.6;1" dur="8s" repeatCount="indefinite"/></path>
    <path d="M862 265 L862 225 L1009 210 L1009 160 L862 135 L862 90" fill="none" stroke="url(#gv)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;0.6;1" dur="8s" repeatCount="indefinite"/></path>
    <circle r="5" fill="#fbbf24"><animateMotion path="M862 265 L862 225 L1009 210 L1009 160 L862 135 L862 90" dur="8s" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear" repeatCount="indefinite"/></circle>
    <text x="1030" y="150" fill="#8b949e">space–time path</text>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="379" rx="18" fill="none" stroke="#1c2533"/>
</svg>
